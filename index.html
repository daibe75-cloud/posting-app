<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ポスティング報告</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
    #map-container { position: relative; flex: 1; width: 100%; min-height: 50vh; }
    #map { width: 100%; height: 100%; }
    #controls { padding: 8px; background: #f1f3f5; text-align: center; display: flex; gap: 8px; justify-content: center; }
    .btn { flex: 1; padding: 12px; font-size: 14px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; }
    .btn-draw { background: #0d6efd; }
    .btn-draw.active { background: #dc3545; }
    .btn-clear { background: #6c757d; max-width: 100px; }
    #form-container { padding: 15px; background: #ffffff; border-top: 1px solid #ccc; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 12px; color: #666; margin-bottom: 3px; }
    input { width: 100%; padding: 10px; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
    button.submit-btn { width: 100%; padding: 14px; background: #198754; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 5px; }
    
    /* 生成された地図画像のみの表示エリア */
    #captured-image-container { display: none; padding: 15px; background: #e9ecef; text-align: center; border-top: 2px dashed #198754; }
    #captured-image-container img { width: 100%; max-height: 300px; object-fit: contain; border: 1px solid #0d6efd; margin-top: 8px; border-radius: 6px; background: #fff; }
  </style>
</head>
<body>

  <!-- 操作ボタン -->
  <div id="controls">
    <button type="button" id="toggle-draw" class="btn btn-draw">📍 範囲を描く (OFF)</button>
    <button type="button" id="clear-map" class="btn btn-clear">🗑 クリア</button>
  </div>

  <!-- 地図エリア（ここだけを画像として切り出します） -->
  <div id="map-container">
    <div id="map"></div>
  </div>

  <!-- 報告フォーム -->
  <div id="form-container">
    <form id="report-form">
      <div class="form-group">
        <label>担当者名</label>
        <input type="text" id="staff-name" placeholder="例: 奈良 太郎" required>
      </div>
      <div class="form-group">
        <label>日付</label>
        <input type="date" id="report-date" required>
      </div>
      <div class="form-group">
        <label>配布枚数</label>
        <input type="number" id="sheet-count" placeholder="例: 500" required>
      </div>
      <button type="submit" class="submit-btn">地図画像を生成してメール起動</button>
    </form>
  </div>

  <!-- 切り出された地図画像の表示場所 -->
  <div id="captured-image-container">
    <p style="font-size:13px; font-weight:bold; color:#d9534f; margin:0;">
      📸 描画した【地図部分のみ】の画像が生成されました！<br>下の画像を長押しして「保存」または「コピー」してメールに添付してください。
    </p>
    <img id="captured-img" src="" alt="地図スクショ">
  </div>

  <!-- JSライブラリ -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- 画面キャプチャ用ライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    // 1. 地図初期化
    const map = L.map('map', { tap: true }).setView([34.6851, 135.8048], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap',
      crossOrigin: 'anonymous' // クロスドメイン画像をキャプチャ可能にする
    }).addTo(map);

    document.getElementById('report-date').valueAsDate = new Date();

    // 2. タップ描画処理
    let isDrawing = false;
    let clickPoints = [];
    let currentPolygon = null;
    let markers = [];

    const toggleBtn = document.getElementById('toggle-draw');
    const clearBtn = document.getElementById('clear-map');

    toggleBtn.addEventListener('click', () => {
      isDrawing = !isDrawing;
      if (isDrawing) {
        toggleBtn.innerText = '🔴 タップで範囲を指定中...';
        toggleBtn.classList.add('active');
      } else {
        toggleBtn.innerText = '📍 範囲を描く (OFF)';
        toggleBtn.classList.remove('active');
      }
    });

    map.on('click', (e) => {
      if (!isDrawing) return;
      const latlng = e.latlng;
      clickPoints.push([latlng.lat, latlng.lng]);

      const marker = L.circleMarker(latlng, { radius: 5, color: '#dc3545', fillColor: '#dc3545', fillOpacity: 1 }).addTo(map);
      markers.push(marker);

      if (clickPoints.length >= 2) {
        if (currentPolygon) map.removeLayer(currentPolygon);
        currentPolygon = L.polygon(clickPoints, { color: '#0d6efd', fillColor: '#0d6efd', fillOpacity: 0.4 }).addTo(map);
      }
    });

    clearBtn.addEventListener('click', resetMapData);

    function resetMapData() {
      clickPoints = [];
      if (currentPolygon) map.removeLayer(currentPolygon);
      markers.forEach(m => map.removeLayer(m));
      markers = [];
      currentPolygon = null;
      if (isDrawing) toggleBtn.click();
      document.getElementById('captured-image-container').style.display = 'none';
    }

    // 3. 【地図部分だけ】をキャプチャしてメール起動
    document.getElementById('report-form').addEventListener('submit', function(e) {
      e.preventDefault();

      if (clickPoints.length < 3) {
        alert('地図上を3箇所以上タップして、ポスティング範囲を囲んでください。');
        return;
      }

      const name = document.getElementById('staff-name').value;
      const date = document.getElementById('report-date').value;
      const count = document.getElementById('sheet-count').value;
      
      // ★★★ あなたのアドレスを設定 ★★★
      const mailTo = 'daibe75@gmail.com'; 

      // 地図エレメント（#map）だけを指定して画像化
      const mapElement = document.getElementById('map');
      
      html2canvas(mapElement, {
        useCORS: true,
        allowTaint: true,
        logging: false
      }).then(canvas => {
        // 画像を生成して下部にセット
        const imgData = canvas.toDataURL('image/png');
        const imgElement = document.getElementById('captured-img');
        imgElement.src = imgData;
        
        // 画像表示エリアをオープン
        const container = document.getElementById('captured-image-container');
        container.style.display = 'block';
        container.scrollIntoView({ behavior: 'smooth' }); // スクロールして画像を見せる

        // メール起動
        const subject = encodeURIComponent(`【ポスティング報告】${date} ${name}様`);
        const body = encodeURIComponent(
          `ポスティング報告が届きました。\n\n` +
          `--------------------\n` +
          `■ 担当者名: ${name}\n` +
          `■ 実施日付: ${date}\n` +
          `■ 配布枚数: ${count}枚\n` +
          `■ 実施エリア: 奈良市内（添付地図を参照）\n` +
          `--------------------\n` +
          `※アプリで作成された地図画像を添付して送信してください。`
        );

        window.location.href = `mailto:${mailTo}?subject=${subject}&body=${body}`;
      });
    });
  </script>
</body>
</html>
