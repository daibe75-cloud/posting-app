<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポスティング報告（Gmail対応版）</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    #map { flex: 1; width: 100%; min-height: 50vh; }
    #controls { padding: 10px; background: #eee; text-align: center; border-bottom: 1px solid #ccc; }
    #form-container { padding: 15px; background: #f8f9fa; border-top: 1px solid #ccc; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 12px; color: #666; margin-bottom: 3px; }
    input { width: 100%; padding: 10px; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 12px; background: #ea4335; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .btn-secondary { background: #6c757d; margin-bottom: 8px; color: white; border: none; padding: 8px 12px; border-radius: 4px; }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>

  <!-- フリーハンド操作ボタン -->
  <div id="controls">
    <button type="button" id="toggle-draw" class="btn-secondary">✏️ フリーハンドで範囲を描く (OFF)</button>
    <button type="button" id="clear-map" class="btn-secondary" style="background:#dc3545;">🗑 描いた範囲を消す</button>
  </div>

  <!-- 地図エリア -->
  <div id="map"></div>

  <!-- 報告フォーム -->
  <div id="form-container">
    <form id="report-form">
      <div class="form-group">
        <label>担当者名</label>
        <input type="text" id="staff-name" placeholder="例: 奈良 太郎" required>
      </div>
      <div class="form-group">
        <label>日付</label>
        <input type="date" id="report-date" required>
      </div>
      <div class="form-group">
        <label>配布枚数</label>
        <input type="number" id="sheet-count" placeholder="例: 500" required>
      </div>
      <button type="submit">Gmailで報告メールを作成</button>
    </form>
  </div>

  <!-- JSライブラリ -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- フリーハンド描画ライブラリ -->
  <script src="https://unpkg.com/leaflet-freehandshapes@0.3.4/dist/leaflet-freehandshapes.min.js"></script>

  <script>
    // 1. 地図初期化（奈良市固定: 緯度 34.6851, 経度 135.8048）
    const map = L.map('map', {
      touchZoom: false // 描画時の誤作動防止
    }).setView([34.6851, 135.8048], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // 今日を初期セット
    document.getElementById('report-date').valueAsDate = new Date();

    // 2. フリーハンド機能の初期化
    const drawer = new L.FreeHandShapes({
      polygon: {
        color: '#ea4335',
        fillColor: '#ea4335',
        fillOpacity: 0.4,
        weight: 3
      }
    });
    map.addLayer(drawer);

    // 描画モードの切り替え
    let isDrawing = false;
    const toggleBtn = document.getElementById('toggle-draw');

    toggleBtn.addEventListener('click', () => {
      isDrawing = !isDrawing;
      if (isDrawing) {
        drawer.enable();
        toggleBtn.innerText = '🔴 フリーハンド描画中（指でなぞる）';
        toggleBtn.style.background = '#28a745';
      } else {
        drawer.disable();
        toggleBtn.innerText = '✏️ フリーハンドで範囲を描く (OFF)';
        toggleBtn.style.background = '#6c757d';
      }
    });

    // 地図クリアボタン
    document.getElementById('clear-map').addEventListener('click', () => {
      drawer.clearLayers();
    });

    // 3. Gmail送信処理
    document.getElementById('report-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('staff-name').value;
      const date = document.getElementById('report-date').value;
      const count = document.getElementById('sheet-count').value;

      // ★★★ あなたのGmailアドレスを入力してください ★★★
      const mailTo = 'daibe75@gmail.com';

      const subject = encodeURIComponent(`【ポスティング報告】${date} ${name}様`);
      const body = encodeURIComponent(
        `ポスティング報告が届きました。\n\n` +
        `--------------------\n` +
        `■ 担当者名: ${name}\n` +
        `■ 実施日付: ${date}\n` +
        `■ 配布枚数: ${count}枚\n` +
        `■ 実施エリア: 奈良市内（描画完了）\n` +
        `--------------------`
      );

      // Web版Gmailの作成画面URLを自動生成
      const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${mailTo}&su=${subject}&body=${body}`;

      // 別タブ（新しいウィンドウ）でGmail作成画面を開く
      window.open(gmailUrl, '_blank');

      // 画面のリセット
      setTimeout(() => {
        if (confirm('Gmail画面を開きました。アプリの入力欄と地図上の範囲をリセットしますか？')) {
          document.getElementById('report-form').reset();
          document.getElementById('report-date').valueAsDate = new Date();
          drawer.clearLayers(); // 描画を消す
          if (isDrawing) toggleBtn.click(); // 描画モード解除
        }
      }, 1000);
    });
  </script>
</body>
</html>
