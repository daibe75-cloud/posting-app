<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポスティング報告</title>
  <!-- Leaflet (地図ライブラリ) & Geoman (描画機能) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    #map { flex: 1; width: 100%; min-height: 50vh; }
    #form-container { padding: 15px; background: #f8f9fa; border-top: 1px solid #ccc; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 12px; color: #666; margin-bottom: 3px; }
    input { width: 100%; padding: 10px; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:active { background: #0056b3; }
  </style>
</head>
<body>

  <!-- 地図表示エリア -->
  <div id="map"></div>

  <!-- 報告フォーム -->
  <div id="form-container">
    <form id="report-form">
      <div class="form-group">
        <label>担当者名</label>
        <input type="text" id="staff-name" placeholder="例: 山田 太郎" required>
      </div>
      <div class="form-group">
        <label>日付</label>
        <input type="date" id="report-date" required>
      </div>
      <div class="form-group">
        <label>配布枚数</label>
        <input type="number" id="sheet-count" placeholder="例: 500" required>
      </div>
      <button type="submit">メールを作成して報告</button>
    </form>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.js"></script>
  <script>
    // 1. 地図の初期化 (デフォルト位置: 東京 ※GPSが使えれば現在地に移動可能)
    const map = L.map('map').setView([35.681236, 139.767125], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 2. 地図に図形を描くモード（ポリゴン・ペン）を追加
    map.pm.addControls({
      position: 'topleft',
      drawPolygon: true,
      drawPolyline: true,
      editMode: false,
      dragMode: false,
      cutPolygon: false,
      removalMode: true
    });

    // 今日の日付を初期セット
    document.getElementById('report-date').valueAsDate = new Date();

    // 描画されたエリアのデータを管理
    let drawnLayers = [];
    map.on('pm:create', (e) => {
      drawnLayers.push(e.layer);
    });

    // 3. フォーム送信処理
    document.getElementById('report-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('staff-name').value;
      const date = document.getElementById('report-date').value;
      const count = document.getElementById('sheet-count').value;

      // エリアが描画されているかチェック
      if (drawnLayers.length === 0) {
        alert('地図上にポスティング実施範囲を描き込んでください。');
        return;
      }

      // メール本文の組み立て
      const mailTo = 'reporting@example.com'; // ★送信先アドレスを設定
      const subject = encodeURIComponent(`【ポスティング報告】${date} ${name}様`);
      const body = encodeURIComponent(
        `ポスティング報告が届きました。\n\n` +
        `--------------------\n` +
        `■ 担当者名: ${name}\n` +
        `■ 実施日付: ${date}\n` +
        `■ 配布枚数: ${count}枚\n` +
        `■ 実施エリア: 地図上に描画完了 (${drawnLayers.length}箇所)\n` +
        `--------------------`
      );

      // スマホの標準メールアプリを起動
      window.location.href = `mailto:${mailTo}?subject=${subject}&body=${body}`;

      // 4. 画面のリセット
      setTimeout(() => {
        if (confirm('報告メールを起動しました。入力内容と地図描画をリセットしますか？')) {
          // フォーム初期化
          document.getElementById('report-form').reset();
          document.getElementById('report-date').valueAsDate = new Date();

          // 地図上の描画をクリア
          drawnLayers.forEach(layer => map.removeLayer(layer));
          drawnLayers = [];
        }
      }, 1000);
    });
  </script>
</body>
</html>
