<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ポスティング報告（奈良市版）</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet Draw CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    #map { flex: 1; width: 100%; min-height: 55vh; }
    #form-container { padding: 15px; background: #f8f9fa; border-top: 1px solid #ccc; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 12px; color: #666; margin-bottom: 3px; }
    input { width: 100%; padding: 10px; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
    button.submit-btn { width: 100%; padding: 12px; background: #ea4335; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button.submit-btn:active { opacity: 0.8; }
    /* 地図上の操作ガイド */
    .map-instruction { background: #fff3cd; color: #856404; padding: 8px; text-align: center; font-size: 13px; font-weight: bold; border-bottom: 1px solid #ffeeba; }
  </style>
</head>
<body>

  <div class="map-instruction">
    📍 地図左上の「多角形」または「四角形」アイコンをタップして範囲を描いてください
  </div>

  <!-- 地図エリア -->
  <div id="map"></div>

  <!-- 報告フォーム -->
  <div id="form-container">
    <form id="report-form">
      <div class="form-group">
        <label>担当者名</label>
        <input type="text" id="staff-name" placeholder="例: 奈良 太郎" required>
      </div>
      <div class="form-group">
        <label>日付</label>
        <input type="date" id="report-date" required>
      </div>
      <div class="form-group">
        <label>配布枚数</label>
        <input type="number" id="sheet-count" placeholder="例: 500" required>
      </div>
      <button type="submit" class="submit-btn">Gmailで報告メールを作成</button>
    </form>
  </div>

  <!-- JSライブラリ -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Leaflet Draw JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

  <script>
    // 1. 地図初期化（奈良市固定: 緯度 34.6851, 経度 135.8048）
    const map = L.map('map').setView([34.6851, 135.8048], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // 今日を初期セット
    document.getElementById('report-date').valueAsDate = new Date();

    // 2. 描画機能の設定（Leaflet.Draw）
    const drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    const drawControl = new L.Control.Draw({
      draw: {
        polyline: false, // 線は無効
        circle: false,   // 円は無効
        circlemarker: false,
        marker: false,
        polygon: {
          allowIntersection: false,
          shapeOptions: { color: '#ea4335', fillColor: '#ea4335', fillOpacity: 0.4 }
        },
        rectangle: {
          shapeOptions: { color: '#ea4335', fillColor: '#ea4335', fillOpacity: 0.4 }
        }
      },
      edit: {
        featureGroup: drawnItems,
        remove: true // ごみ箱アイコンで削除可能
      }
    });
    map.addControl(drawControl);

    // 描画が完了した時の処理
    map.on(L.Draw.Event.CREATED, function (e) {
      const layer = e.layer;
      drawnItems.addLayer(layer);
    });

    // 3. Gmail送信処理
    document.getElementById('report-form').addEventListener('submit', function(e) {
      e.preventDefault();

      if (drawnItems.getLayers().length === 0) {
        alert('地図上にポスティング範囲を描画してください。');
        return;
      }

      const name = document.getElementById('staff-name').value;
      const date = document.getElementById('report-date').value;
      const count = document.getElementById('sheet-count').value;

      // ★★★ あなたのGmailアドレスを入力してください ★★★
      const mailTo = 'daibe75@gmail.com';

      const subject = encodeURIComponent(`【ポスティング報告】${date} ${name}様`);
      const body = encodeURIComponent(
        `ポスティング報告が届きました。\n\n` +
        `--------------------\n` +
        `■ 担当者名: ${name}\n` +
        `■ 実施日付: ${date}\n` +
        `■ 配布枚数: ${count}枚\n` +
        `■ 実施エリア: 奈良市内（描画完了）\n` +
        `--------------------`
      );

      const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${mailTo}&su=${subject}&body=${body}`;
      window.open(gmailUrl, '_blank');

      // 画面のリセット
      setTimeout(() => {
        if (confirm('Gmail画面を開きました。アプリの入力欄と地図上の範囲をリセットしますか？')) {
          document.getElementById('report-form').reset();
          document.getElementById('report-date').valueAsDate = new Date();
          drawnItems.clearLayers(); // 描画したエリアを消去
        }
      }, 1000);
    });
  </script>
</body>
</html>
