<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ポスティング報告</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    #map { flex: 1; width: 100%; min-height: 40vh; background: #e0e0e0; }
    #controls { padding: 8px; background: #f1f3f5; text-align: center; display: flex; gap: 8px; justify-content: center; }
    .btn { flex: 1; padding: 12px; font-size: 14px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; }
    .btn-draw { background: #0d6efd; }
    .btn-draw.active { background: #dc3545; }
    .btn-clear { background: #6c757d; max-width: 100px; }
    #form-container { padding: 15px; background: #ffffff; border-top: 1px solid #ccc; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 12px; color: #666; margin-bottom: 3px; }
    /* 入力欄のサイズ統一（日付欄の見た目を他のテキスト・数字入力と揃える設定） */
    input[type="text"], input[type="date"], input[type="number"] {
      width: 100%;
      height: 42px;
      padding: 8px 10px;
      box-sizing: border-box;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: #fff;
      -webkit-appearance: none; /* スマホ独自デザインの崩れを防止 */
    }
    button.submit-btn { width: 100%; padding: 14px; background: #198754; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 5px; }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>

  <!-- ボタン操作エリア -->
  <div id="controls">
    <button type="button" id="toggle-draw" class="btn btn-draw">📍 範囲を描く (OFF)</button>
    <button type="button" id="clear-map" class="btn btn-clear">🗑 クリア</button>
  </div>

  <!-- 地図エリア -->
  <div id="map"></div>

  <!-- 報告フォーム -->
  <div id="form-container">
    <form id="report-form">
      <div class="form-group">
        <label>担当者名</label>
        <input type="text" id="staff-name" placeholder="例: 奈良 太郎" required>
      </div>
      <div class="form-group">
        <label>日付</label>
        <input type="date" id="report-date" required>
      </div>
      <!-- 追加：配布物の種類 -->
      <div class="form-group">
        <label>配布物の種類</label>
        <input type="text" id="item-type" placeholder="例: 新装開店チラシA / クーポン券" required>
      </div>
      <div class="form-group">
        <label>配布枚数</label>
        <input type="number" id="sheet-count" placeholder="例: 500" required>
      </div>
      <button type="submit" id="submit-btn" class="submit-btn">メールを起動して報告</button>
    </form>
  </div>

  <!-- JSライブラリ -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. 地図初期化
    const map = L.map('map', { tap: true }).setView([34.6851, 135.8048], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    document.getElementById('report-date').valueAsDate = new Date();

    // 2. タップ描画処理
    let isDrawing = false;
    let clickPoints = [];
    let currentPolygon = null;
    let markers = [];

    const toggleBtn = document.getElementById('toggle-draw');
    const clearBtn = document.getElementById('clear-map');

    toggleBtn.addEventListener('click', () => {
      isDrawing = !isDrawing;
      if (isDrawing) {
        toggleBtn.innerText = '🔴 タップで範囲を指定中...';
        toggleBtn.classList.add('active');
      } else {
        toggleBtn.innerText = '📍 範囲を描く (OFF)';
        toggleBtn.classList.remove('active');
      }
    });

    map.on('click', (e) => {
      if (!isDrawing) return;
      const latlng = e.latlng;
      clickPoints.push([latlng.lat, latlng.lng]);

      const marker = L.circleMarker(latlng, { radius: 5, color: '#dc3545', fillColor: '#dc3545', fillOpacity: 1 }).addTo(map);
      markers.push(marker);

      if (clickPoints.length >= 2) {
        if (currentPolygon) map.removeLayer(currentPolygon);
        currentPolygon = L.polygon(clickPoints, { color: '#0d6efd', fillColor: '#0d6efd', fillOpacity: 0.4 }).addTo(map);
      }
    });

    clearBtn.addEventListener('click', resetMapData);

    function resetMapData() {
      clickPoints = [];
      if (currentPolygon) map.removeLayer(currentPolygon);
      markers.forEach(m => map.removeLayer(m));
      markers = [];
      currentPolygon = null;
      if (isDrawing) toggleBtn.click();
    }

    // 3. 住所自動取得 ＆ メール起動処理
    document.getElementById('report-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      if (clickPoints.length < 3) {
        alert('地図上を3箇所以上タップして、ポスティング範囲を囲んでください。');
        return;
      }

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = '住所を取得中...';

      const name = document.getElementById('staff-name').value;
      const date = document.getElementById('report-date').value;
      const itemType = document.getElementById('item-type').value; // 配布物の種類
      const count = document.getElementById('sheet-count').value;

      // ★★★ アドレスを設定してください ★★★
      const mailTo = 'daibe75@gmail.com'; 

      // 描画されたエリアの中心座標を計算
      const firstPoint = clickPoints[0];
      const lat = firstPoint[0];
      const lng = firstPoint[1];

      // 逆ジオコーディング（座標から町名を自動取得）
      let areaName = "奈良市内（詳細位置取得失敗）";
      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`, {
          headers: { 'Accept-Language': 'ja' }
        });
        const data = await response.json();
        
        if (data && data.address) {
          // 町名や地区名を取得
          const suburb = data.address.suburb || data.address.neighbourhood || data.address.quarter || data.address.city_district || "";
          const city = data.address.city || data.address.town || "";
          areaName = `${city}${suburb} 周辺`;
        }
      } catch (err) {
        console.log("住所取得エラー:", err);
      }

      submitBtn.disabled = false;
      submitBtn.innerText = 'メールを起動して報告';

      // メール本文の組み立て
      const subject = encodeURIComponent(`【ポスティング報告】${date} ${name}様`);
      const body = encodeURIComponent(
        `ポスティング報告が届きました。\n\n` +
        `--------------------\n` +
        `■ 担当者名: ${name}\n` +
        `■ 実施日付: ${date}\n` +
        `■ 配布物: ${itemType}\n` +
        `■ 配布枚数: ${count}枚\n` +
        `■ 代表エリア: ${areaName}\n` +
        `--------------------\n` +
        `※撮影した地図のスクリーンショットを添付して送信してください。`
      );

      // メールアプリ起動
      window.location.href = `mailto:${mailTo}?subject=${subject}&body=${body}`;

      // リセット確認
      setTimeout(() => {
        if (confirm('メールアプリを起動しました。入力欄と地図上の描画をクリアしますか？')) {
          document.getElementById('report-form').reset();
          document.getElementById('report-date').valueAsDate = new Date();
          resetMapData();
        }
      }, 1000);
    });
  </script>
</body>
</html>
